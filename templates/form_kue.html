{% extends "base.html" %}
{% block title %}{{ aksi }} Produk - Oven & Dough{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-12">
    <div class="mb-6">
        <a href="{{ url_for('dashboard') }}" class="text-gray-500 hover:text-amber-600 font-bold transition">← Kembali ke Dashboard</a>
    </div>

    <div class="bg-white rounded-3xl shadow-xl p-8 border border-gray-100">
        <h2 class="text-3xl font-black text-gray-900 mb-8">{{ aksi }} Data Kue</h2>
        
        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Nama Kue</label>
                <input type="text" name="nama" required placeholder="Contoh: Strawberry Cheesecake" 
                       value="{{ kue.nama if kue else '' }}"
                       class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Harga (Angka saja)</label>
                    <input type="number" name="harga" required placeholder="150000" 
                           value="{{ kue.harga_int if kue else '' }}"
                           class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Kategori</label>
                    <select name="kategori" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none">
                        <option value="Signature" {% if kue and kue.kategori == 'Signature' %}selected{% endif %}>Signature</option>
                        <option value="Premium" {% if kue and kue.kategori == 'Premium' %}selected{% endif %}>Premium</option>
                        <option value="Bestseller" {% if kue and kue.kategori == 'Bestseller' %}selected{% endif %}>Bestseller</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">URL Gambar (Dari Unsplash/Google)</label>
                <input type="url" name="gambar" required placeholder="https://..." 
                       value="{{ kue.gambar if kue else '' }}"
                       class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Deskripsi Produk</label>
                <textarea name="deskripsi" rows="4" required placeholder="Jelaskan kelezatan kue ini..." 
                          class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none">{{ kue.deskripsi if kue else '' }}</textarea>
            </div>
            
            <button type="submit" class="w-full bg-amber-600 text-white font-black py-4 rounded-xl hover:bg-amber-700 transition shadow-lg mt-4">
                💾 Simpan ke Database
            </button>
        </form>
    </div>
</div>
{% endblock %}
