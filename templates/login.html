{% extends "base.html" %}

{% block title %}Admin Login - Oven & Dough{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-24">
    <div class="bg-white rounded-3xl shadow-2xl p-10 border border-gray-100">
        <div class="text-center mb-8">
            <div class="text-5xl mb-4">🔐</div>
            <h2 class="text-3xl font-black text-gray-900">Admin Login</h2>
            <p class="text-gray-500 mt-2">Silakan masuk untuk mengelola toko.</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Username</label>
                <input type="text" name="username" required placeholder="Masukkan username" 
                       class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Password</label>
                <input type="password" name="password" required placeholder="••••••••" 
                       class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none transition">
            </div>
            <button type="submit" class="w-full bg-gray-900 text-white font-black py-4 rounded-xl hover:bg-amber-600 transition shadow-lg mt-4">
                Masuk Dashboard
            </button>
        </form>
    </div>
</div>
{% endblock %}
